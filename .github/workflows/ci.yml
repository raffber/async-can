name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# All jobs use the toolchain pinned in rust-toolchain.toml, except `msrv`.
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-features --all-targets
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --all-features
      # The crate-level doc examples use the Linux-only `socketcan` module, so skip doctests on Windows.
      - name: Test (without doctests)
        if: runner.os == 'Windows'
        run: cargo test --all-features --lib --tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (Linux)
        run: cargo clippy --all-features --all-targets
      - name: Clippy (Windows)
        run: cargo clippy --all-features --all-targets --target x86_64-pc-windows-gnu
      - name: Clippy (32-bit Linux)
        run: cargo clippy --all-features --all-targets --target i686-unknown-linux-gnu
      - name: Docs
        run: cargo doc --all-features --no-deps

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Check each feature
        run: cargo hack check --each-feature --no-dev-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$MSRV" --profile minimal
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo +"$MSRV" check --all-features

  socketcan:
    name: SocketCAN (vcan)
    # Pinned: the ubuntu-latest (26.04) image runs a kernel whose
    # linux-modules-extra package (which provides vcan) is not in the archive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Set up vcan0
        run: |
          if ! sudo modprobe vcan; then
            sudo apt-get update
            sudo apt-get install --yes "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
      - name: Send and receive on vcan0
        run: cargo test --lib -- --ignored --exact socketcan::test::socketcan_send_receive
      # Runs last because it leaves vcan0 down. Setting interfaces up and down requires
      # CAP_NET_ADMIN, so run the test binary with sudo.
      - name: Set vcan0 up and down
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: cargo test --lib -- --ignored --exact socketcan::test::socketcan_devices_up_down

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Run cspell
        run: npx --yes cspell@9 --no-progress --gitignore "**"
